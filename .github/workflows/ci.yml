name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'     # weekly: new CVEs appear against unchanged code
  workflow_dispatch:

# WHY: least privilege. A compromised dependency or action in this workflow can read the repo
# but cannot push, tag, or edit releases.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint, test, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # the git token is not left on disk for later steps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint (ESLint + security plugin)
        run: npm run lint
      - name: Unit tests (auth, CSRF, validation)
        run: npm test
      - name: Dependency audit (production deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

  client:
    name: Client (unit, E2E, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject placeholder API rewrite hostname
        run: |
          if grep -Fq 'replace-with-public-api-host.invalid' vercel.json; then
            echo 'Replace the placeholder API hostname in client/vercel.json before deploying.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install browser for E2E tests
        run: npx playwright install --with-deps chromium
      - name: Browser E2E tests
        run: npm run test:e2e
      - name: Production build
        run: npm run build
        env:
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - name: Dependency audit (production deps, fail on high/critical)
        run: npm audit --omit=dev --audit-level=high