name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read            # needed on private repos
      security-events: write   # uploads findings to the Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended   # more rules than default, a few more false positives
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript