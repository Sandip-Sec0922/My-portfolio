name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # a secret deleted in a later commit is still in history
          persist-credentials: false
      # WHY run the CLI directly: the official gitleaks Action needs a paid license for
      # organization repos. The safe.directory env vars stop git refusing the mounted checkout.
      - name: Scan full git history
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.21.2 git --redact --verbose --config /repo/.gitleaks.toml /repo