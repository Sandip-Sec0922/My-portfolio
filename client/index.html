<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />

      content="Sandip Kepchhaki"
    />

      property="og:image"
      content="https://www.sandipkepchhaki.com.np/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- External (not inline) so the strict CSP stays intact. Runs before paint: no theme flash. -->
    <script src="/theme-init.js"></script>
  </head>
