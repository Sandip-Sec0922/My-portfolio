# Blueprint format version used by Render.
version: "1"
# Logical Render project grouping.
projects:
  # Render project name shown in the dashboard.
  - name: My project
    # Render environment grouping for this service.
    environments:
      - name: Production
        # Resources provisioned in this environment.
        services:
          # A single publicly reachable backend web service.
          - type: web
            # Render service name.
            name: My-portfolio
            # Build this service from a Dockerfile.
            runtime: docker
            # Git repository containing the Blueprint and backend source.
            repo: https://github.com/Sandip-Sec0922/My-portfolio
            # Render free web-service plan.
            plan: free
            # Environment variables whose values are supplied in Render.
            envVars:
              # Destination for contact-form email notifications; optional with the message inbox.
              - key: NOTIFY_EMAIL
                sync: false
              # Resend API key; use HTTPS email delivery on the free Render plan.
              - key: RESEND_API_KEY
                sync: false
              # Verified sender address, e.g. Portfolio <no-reply@your-verified-domain>.
              - key: RESEND_FROM
                sync: false
              # Optional SMTP fallback password; Render Free blocks outbound SMTP ports.
              - key: SMTP_PASS
                sync: false
              # Optional SMTP fallback username; Render Free blocks outbound SMTP ports.
              - key: SMTP_USER
                sync: false
              # Optional SMTP fallback host; Render Free blocks outbound SMTP ports.
              - key: SMTP_HOST
                sync: false
              # Optional SMTP fallback port; defaults to 587 (STARTTLS).
              - key: SMTP_PORT
                value: "587"
              # Cloudflare Turnstile server-side secret.
              - key: TURNSTILE_SECRET
                sync: false
              # Optional GitHub API token.
              - key: GITHUB_TOKEN
                sync: false
              # GitHub account used for repository data.
              - key: GITHUB_USERNAME
                sync: false
              # Optional cookie domain override.
              - key: COOKIE_DOMAIN
                sync: false
              # Allowed browser frontend origin.
              - key: CORS_ORIGINS
                value: https://my-portfolio-m3bc-pink.vercel.app,https://my-portfolio-m3bc-9f23jsctz-sandip-80b8.vercel.app
              # Canonical frontend URL used to generate the API sitemap.
              - key: PUBLIC_SITE_URL
                value: https://my-portfolio-m3bc-pink.vercel.app
              # Required external Redis-compatible connection URL (for example, Upstash rediss:// URL).
              - key: REDIS_URL
                sync: false
              # CSRF signing secret.
              - key: CSRF_SECRET
                sync: false
              # Refresh-token signing secret.
              - key: JWT_REFRESH_SECRET
                sync: false
              # Access-token signing secret.
              - key: JWT_ACCESS_SECRET
                sync: false
              # Local Compose Redis password; not the external REDIS_URL.
              - key: REDIS_PASSWORD
                sync: false
              # MongoDB Atlas connection string.
              - key: MONGO_URI
                sync: false
              # Local Compose Mongo app password; not used with Atlas URI.
              - key: MONGO_APP_PASSWORD
                sync: false
              # Local Compose Mongo app user; not used with Atlas URI.
              - key: MONGO_APP_USER
                sync: false
              # Local Compose database name; Atlas database comes from MONGO_URI.
              - key: MONGO_DB
                sync: false
              # Local Compose Mongo root password; not used with Atlas.
              - key: MONGO_ROOT_PASSWORD
                sync: false
              # Local Compose Mongo root user; not used with Atlas.
              - key: MONGO_ROOT_USER
                sync: false
            # Render deployment region.
            region: singapore
            # Render polls this endpoint; it checks MongoDB and Redis availability.
            healthCheckPath: /api/health
            # Docker build context, relative to the repository root.
            dockerContext: ./server
            # Dockerfile path, relative to the repository root.
            dockerfilePath: server/Dockerfile
            # Deploy on every commit to the linked branch.
            autoDeployTrigger: commit
