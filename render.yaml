services:
  - type: web
    name: soc-portfolio-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://sandipkepchhaki.com.np
      - key: GITHUB_USERNAME
        value: Sandip-Sec0922
      - key: GITHUB_TOKEN
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
